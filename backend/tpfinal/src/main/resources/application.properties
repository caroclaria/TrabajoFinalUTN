# Conexion a Neon (PostgreSQL) y configuración de la app
spring.application.name=tpfinal

# Puerto: en Render llega por la variable PORT; en local se usa 8080
server.port=${PORT:8080}

# Base de datos (Neon). Los valores reales viven en el .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
# validate: Hibernate solo COMPRUEBA que las entidades coincidan con las tablas creadas con esquema_bd.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# CORS: orígenes permitidos separados por coma. En producción se define CORS_ORIGINS con la URL de Vercel
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Admin inicial
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
